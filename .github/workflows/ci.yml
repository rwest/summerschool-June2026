name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  schedule:
    # At 17:31 every Tuesday (UTC)
    # At 9:31 every Tuesday (PST)
    - cron: "31 17 * * 2"
  workflow_dispatch:

jobs:
  # Run tests
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        os: [ubuntu-latest, macOS-latest, windows-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install Dependencies
      run: |
        pip install .[test]

    - name: Test
      run: |
        pytest tests/

  # Check linting, formating, types, etc.
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    
    - name: Install Dependencies
      run: |
        pip install pre-commit

    - name: Lint
      run: |
        pre-commit run --all-files

  # Conceptual release job — publishes to PyPI on a version tag.
  # Guarded with `if: false` so it never runs. Remove the guard and set up
  # PyPI Trusted Publishing to enable.
  release:
    if: false
    needs: [test, lint]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for PyPI Trusted Publishing (OIDC)

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Build distribution
      run: |
        pip install build
        python -m build

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1